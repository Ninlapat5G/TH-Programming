[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "th-programming"
version = "1.0.1"
description = "TH-Programming — ภาษาโปรแกรมที่เขียนเป็นประโยคภาษาไทย แล้วคอมไพล์เป็น Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["thai", "programming-language", "compiler", "nlp", "education"]
classifiers = [
    "Natural Language :: Thai",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: MIT License",
]

# ตั้งใจไม่พึ่งไลบรารีภายนอกเลย — ติดตั้งแล้วใช้ได้ทันที
dependencies = []

[project.urls]
Homepage = "https://github.com/Ninlapat5G/TH-Programming"
Repository = "https://github.com/Ninlapat5G/TH-Programming"

[project.scripts]
thprog = "thprog.cli:main"

[tool.setuptools.packages.find]
include = ["thprog*"]

# คลังคำไทยเป็นไฟล์ .th ไม่ใช่โมดูล Python จึงต้องระบุให้ติดไปด้วย
[tool.setuptools.package-data]
thprog = ["คลัง/*.th"]
